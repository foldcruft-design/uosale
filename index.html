<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#070b14">
<title>Подписка</title>
<link rel="stylesheet" href="style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<div class="bg" aria-hidden="true">
  <i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i>
  <i class="grain"></i>
</div>

<main class="stage">
  <section class="glass" id="card" data-state="idle">
    <span class="sheen" aria-hidden="true"></span>

    <div class="orb" aria-hidden="true">
      <span class="ring r1"></span><span class="ring r2"></span>
      <svg class="plane" viewBox="0 0 48 48" fill="none">
        <path d="M42 7 6 21.5l10.5 4L36 13 21 29.5V40l6-7.5L36 38 42 7Z"
              stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
      </svg>
      <svg class="tick" viewBox="0 0 48 48" fill="none">
        <path d="m13 25 8 8 15-17" stroke="currentColor" stroke-width="3.2"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <h1 id="title">Один шаг до доступа</h1>
    <p id="text" class="lead">Подпишитесь на канал, чтобы открыть поиск и получить 3 бесплатных запроса.</p>

    <div class="actions">
      <button class="btn primary" id="btnSub" type="button">
        <span class="label">Подписаться на канал</span>
        <span class="shine" aria-hidden="true"></span>
      </button>
      <button class="btn ghost" id="btnCheck" type="button">
        <span class="spinner" aria-hidden="true"></span>
        <span class="label">Я подписался</span>
      </button>
    </div>

    <p class="hint" id="hint"></p>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
